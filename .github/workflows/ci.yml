name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
      JWT_SECRET: ci-access-secret-minimum-32-chars-long
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-chars-long
      INTERNAL_PARSER_SECRET: ci-internal-parser-secret-32-chars!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: go test -v ./tests/...

  backend-python:
    runs-on: ubuntu-latest
    if: hashFiles('backend/**') != ''
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite://
      JWT_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt ruff==0.11.6 pytest==8.3.5 pytest-asyncio==0.26.0
      - run: ruff check app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
